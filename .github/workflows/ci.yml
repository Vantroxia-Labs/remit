# ═══════════════════════════════════════════════════════════════════════════
# Vantroxia-Labs/remit — CI + Dokploy deploy
# push main          → build, test, push 3 images, migrator → APIs
# pull_request main  → build + test only
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PORTAL_API_IMAGE: ghcr.io/vantroxia-labs/remit-portal-api
  ERP_API_IMAGE: ghcr.io/vantroxia-labs/remit-erp-api
  MIGRATOR_IMAGE: ghcr.io/vantroxia-labs/remit-migrator
  # NOTE: SFTP API not deployed (uploads go via admin → Portal → NRS).
  # Dockerfile.sftp-api stays in repo; no image built/pushed.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

  docker:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build + push Portal API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.portal-api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.PORTAL_API_IMAGE }}:staging
            ${{ env.PORTAL_API_IMAGE }}:sha-${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Build + push ERP API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.erp-api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ERP_API_IMAGE }}:staging
            ${{ env.ERP_API_IMAGE }}:sha-${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=erp
          cache-to: type=gha,mode=max,scope=erp

      - name: Build + push Migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrator
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:staging
            ${{ env.MIGRATOR_IMAGE }}:sha-${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy-migrator:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy migrator on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ vars.DOKPLOY_MIGRATOR_APP_ID }}
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"
      - name: Wait for migrator to finish
        run: sleep 45

  deploy-apis:
    needs: deploy-migrator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [portal-api, erp-api]
    steps:
      - name: Redeploy ${{ matrix.app }} on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ matrix.app == 'portal-api' && vars.DOKPLOY_PORTAL_API_APP_ID || vars.DOKPLOY_ERP_API_APP_ID }}
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"
